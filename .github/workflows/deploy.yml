name: Desplegar web (GitHub Pages)

# El MISMO archivo sirve para los dos sitios —produccion y el de ensayos—.
# Lo que cambia entre ellos son las variables del repositorio
# (Settings -> Secrets and variables -> Actions -> Variables):
#
#   ENTORNO          produccion | ensayos       (por defecto: produccion)
#   EDICION          (sin definir) | 99         (por defecto: EDICION_ACTUAL de src/lib/liga.ts)
#   PAGES_BASE_PATH  '' | /fundacion-managers-ensayos
#
# Asi los dos repositorios pueden tener el fichero identico y sincronizarse
# con un `git push` sin conflictos. Un workflow duplicado a mano se habria
# separado del original en la segunda semana.
#
# Se publica en tres casos:
#   - push a main: cambios de codigo o de imagenes.
#   - desde el panel (repository_dispatch): cada vez que un administrador
#     guarda algo, el panel pide publicar. El sitio es estatico, asi que
#     guardar en la base no basta; hay que recompilar para que se vea.
#   - revision programada: pide cada 15 minutos, pero GitHub la corre cada
#     2 a 5 horas (medido en octubre de 2026). Es la red de seguridad por si
#     un disparo del panel fallo, no el camino normal.
#   - a mano, desde la pestana Actions.
#
# La revision programada NO compila siempre. Consulta la vista
# public.torneo_marca —ultimo cambio y total de filas— y solo sigue adelante
# si ese estado no se ha publicado todavia. Una ejecucion sin cambios tarda
# unos segundos.
on:
  push:
    branches: [main]
  # Minutos sueltos a proposito, no en punto. GitHub encola los crons de todo
  # el mundo y :00, :15, :30 y :45 son los mas congestionados: ahi las
  # ejecuciones se retrasan o se saltan. El horario es orientativo de todos
  # modos, GitHub no garantiza puntualidad.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  # Disparo desde el panel. Se usa repository_dispatch y no workflow_dispatch
  # porque este ultimo exige derechos de admin sobre el repositorio cuando se
  # llama con un token personal clasico —GitHub responde 403 "Must have admin
  # rights to Repository"—. repository_dispatch se conforma con permiso de
  # escritura, que es el que tiene la cuenta que opera el panel.
  repository_dispatch:
    types: [publicar]

permissions:
  contents: read
  pages: write
  id-token: write

# Las ejecuciones se encolan en vez de cancelarse: cancelar significaria que
# una revision de rutina —que casi siempre no hace nada— o un segundo guardado
# en el panel tumbe un despliegue en curso a mitad de camino.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.decidir.outputs.publicar }}
      marca: ${{ steps.leer.outputs.marca }}
      edicion: ${{ steps.edicion.outputs.edicion }}
    steps:
      # Que edicion se publica. En ensayos la fija la variable EDICION (99).
      # En produccion sale del codigo, de EDICION_ACTUAL: estuvo escrita aqui
      # como '4' por defecto, y al abrir la 5a edicion la web real habria
      # seguido leyendo los datos de la 4a con el codigo de la 5a. Asi cambiar
      # de edicion es tocar un solo numero, en un solo archivo.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: src/lib/liga.ts
          sparse-checkout-cone-mode: false
      - name: Qué edición
        id: edicion
        run: |
          EDICION="${VAR_EDICION}"
          if [ -z "$EDICION" ]; then
            EDICION=$(sed -n 's/^export const EDICION_ACTUAL = \([0-9]*\);.*/\1/p' src/lib/liga.ts)
          fi
          if [ -z "$EDICION" ]; then
            echo "No se pudo leer EDICION_ACTUAL de src/lib/liga.ts" >&2
            exit 1
          fi
          echo "Edición: $EDICION"
          echo "edicion=$EDICION" >> "$GITHUB_OUTPUT"
        env:
          VAR_EDICION: ${{ vars.EDICION }}

      # En un push siempre se publica: cambio el codigo, no solo los datos.
      - name: Leer la marca del torneo
        id: leer
        run: |
          RESPUESTA=$(curl -sS --max-time 30 \
            "${SUPABASE_URL}/rest/v1/torneo_marca_edicion?select=*&edicion=eq.${EDICION}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" || echo '')
          if [ -z "$RESPUESTA" ]; then
            echo "Supabase no respondio; se publica igual para no quedarse atras."
            echo "marca=sin-respuesta-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "marca=$(printf '%s' "$RESPUESTA" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
          fi
        env:
          # La clave publicable esta pensada para exponerse: ya viaja en el
          # bundle del navegador. Quien manda es Row Level Security, y esta
          # vista solo devuelve una fecha y un conteo.
          SUPABASE_URL: https://rlgakgpcfbwhigjdumiv.supabase.co
          SUPABASE_KEY: sb_publishable_VJ4JIosQfATwORGErcb0Dw_VxcrSngy
          EDICION: ${{ steps.edicion.outputs.edicion }}

      # La cache hace de registro de "esto ya se publico". Si la clave existe,
      # este mismo estado ya salio al aire y no hay nada que hacer.
      - name: Ver si este estado ya se publico
        id: yapublicado
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: .marca
          key: torneo-publicado-${{ steps.edicion.outputs.edicion }}-${{ steps.leer.outputs.marca }}
          lookup-only: true

      - name: Decidir
        id: decidir
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Disparado por ${{ github.event_name }}: se publica."
            echo "publicar=si" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.yapublicado.outputs.cache-hit }}" == "true" ]; then
            echo "Sin cambios en el torneo desde la ultima publicacion."
            echo "publicar=no" >> "$GITHUB_OUTPUT"
          else
            echo "El torneo cambio: hay que republicar."
            echo "publicar=si" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: revisar
    if: needs.revisar.outputs.publicar == 'si'
    runs-on: ubuntu-latest
    outputs:
      origen: ${{ steps.origen.outputs.origen }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # La 22 es la que exige "engines" en package.json, y ademas es desde
          # donde el runner de pruebas de Node expande patrones como
          # tests/**/*.test.js. Con la 20 el paso de verificaciones no correria.
          node-version: 22
          cache: npm
      - run: npm ci

      # Las verificaciones corren ANTES de compilar: si la tabla, la llave, el
      # palmares o el ranking de goleadores se contradicen entre si, el sitio
      # no sale al aire. Son pruebas puras sobre los datos del repositorio —no
      # consultan Supabase—, asi que una republicacion programada nunca puede
      # fallar por un cambio hecho desde el panel de administracion.
      - name: Verificaciones
        run: npm test

      - name: Build estático
        env:
          GITHUB_PAGES: 'true'
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '' }}
          NEXT_PUBLIC_ENTORNO: ${{ vars.ENTORNO || 'produccion' }}
          NEXT_PUBLIC_EDICION: ${{ needs.revisar.outputs.edicion }}
        run: npm run build

      # De donde salieron los datos: build-info lo anota. Si fue el respaldo,
      # el estado no se guarda como publicado y la siguiente revision lo
      # vuelve a intentar.
      - name: Origen de los datos
        id: origen
        run: echo "origen=$(node -p "require('./out/build-info.json').origen")" >> "$GITHUB_OUTPUT"

      # El CNAME de public/ reclama fundacionmanagers.com. En el sitio de
      # ensayos eso le disputaria el dominio a la web real, asi que se
      # borra del artefacto: la replica vive en la URL de github.io.
      - name: Quitar el dominio propio fuera de producción
        if: vars.ENTORNO == 'ensayos'
        run: rm -f out/CNAME

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: [revisar, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # La marca se guarda DESPUES de desplegar, no antes: si el despliegue
      # falla, el estado sigue contando como no publicado y el siguiente cron
      # lo reintenta en vez de darlo por hecho.
      - name: Anotar el estado publicado
        if: success() && github.event_name == 'schedule' && needs.build.outputs.origen == 'supabase'
        run: mkdir -p .marca && echo "${{ needs.revisar.outputs.marca }}" > .marca/publicado.txt
      - name: Guardar la marca
        if: success() && github.event_name == 'schedule' && needs.build.outputs.origen == 'supabase'
        uses: actions/cache/save@v6
        with:
          path: .marca
          key: torneo-publicado-${{ needs.revisar.outputs.edicion }}-${{ needs.revisar.outputs.marca }}
